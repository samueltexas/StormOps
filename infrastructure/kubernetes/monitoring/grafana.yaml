apiVersion: v1
kind: ConfigMap
metadata:
  name: stormops-grafana-provisioning
  namespace: stormops-monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: StormOps Prometheus
        uid: stormops-prometheus
        type: prometheus
        access: proxy
        url: http://stormops-prometheus.stormops-monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: StormOps
        orgId: 1
        folder: StormOps
        type: file
        disableDeletion: true
        options:
          path: /var/lib/grafana/dashboards
  stormops.json: |
    {
      "uid": "stormops-overview",
      "title": "StormOps - Resilience Overview",
      "tags": ["stormops", "java", "kubernetes"],
      "timezone": "browser",
      "schemaVersion": 41,
      "refresh": "10s",
      "time": {"from": "now-15m", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Demo Service Available",
          "gridPos": {"x": 0, "y": 0, "w": 8, "h": 5},
          "datasource": {"type": "prometheus", "uid": "stormops-prometheus"},
          "targets": [
            {"refId": "A", "expr": "up{job=\"stormops-demo\"}"}
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "HTTP Requests per Second",
          "gridPos": {"x": 8, "y": 0, "w": 16, "h": 8},
          "datasource": {"type": "prometheus", "uid": "stormops-prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_requests_seconds_count{application=\"stormops-demo\"}[1m]))"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "JVM Heap Memory",
          "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "stormops-prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "jvm_memory_used_bytes{area=\"heap\"}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "HTTP Error Rate",
          "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "stormops-prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[1m])) or vector(0)"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stormops-grafana
  namespace: stormops-monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stormops-grafana
  template:
    metadata:
      labels:
        app: stormops-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stormops-grafana-admin
                  key: password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
              subPath: datasource.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: provisioning
              mountPath: /var/lib/grafana/dashboards/stormops.json
              subPath: stormops.json
      volumes:
        - name: provisioning
          configMap:
            name: stormops-grafana-provisioning
---
apiVersion: v1
kind: Service
metadata:
  name: stormops-grafana
  namespace: stormops-monitoring
spec:
  selector:
    app: stormops-grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
