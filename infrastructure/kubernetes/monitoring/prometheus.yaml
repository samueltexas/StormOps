apiVersion: v1
kind: ConfigMap
metadata:
  name: stormops-prometheus-config
  namespace: stormops-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules.yml

    scrape_configs:
      - job_name: stormops-demo
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - stormops-demo.stormops-lab.svc.cluster.local:8080
  rules.yml: |
    groups:
      - name: stormops-local-observability
        rules:
          - alert: StormOpsDemoTelemetryMissing
            expr: absent(up{job="stormops-demo"}) or (up{job="stormops-demo"} == 0)
            for: 2m
            labels:
              severity: warning
              scope: local-lab
            annotations:
              summary: Demo scrape target is absent or unavailable
              description: Review the local Prometheus target and service before any further fault injection
          - alert: StormOpsDemoHighHttp5xxRate
            expr: |
              (
                sum(rate(http_server_requests_seconds_count{job="stormops-demo",uri!~"/actuator.*",status=~"5.."}[5m]))
                /
                clamp_min(sum(rate(http_server_requests_seconds_count{job="stormops-demo",uri!~"/actuator.*"}[5m])), 0.001)
              ) > 0.05
              and on()
              sum(rate(http_server_requests_seconds_count{job="stormops-demo",uri!~"/actuator.*"}[5m])) > 0
            for: 2m
            labels:
              severity: warning
              scope: local-lab
            annotations:
              summary: Demo HTTP 5xx ratio exceeds five percent
              description: Investigate sustained errors in the local demonstration service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stormops-prometheus
  namespace: stormops-monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stormops-prometheus
  template:
    metadata:
      labels:
        app: stormops-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
            - --storage.tsdb.retention.size=256MB
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: stormops-prometheus-config
        - name: data
          emptyDir:
            sizeLimit: 300Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stormops-prometheus
  namespace: stormops-monitoring
spec:
  selector:
    app: stormops-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
