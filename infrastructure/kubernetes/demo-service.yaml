apiVersion: apps/v1
kind: Deployment
metadata:
  name: stormops-demo
  namespace: stormops-lab
  labels:
    app: stormops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stormops-demo
  template:
    metadata:
      labels:
        app: stormops-demo
    spec:
      containers:
        - name: demo
          image: stormops/sample-java-service:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: stormops-demo
  namespace: stormops-lab
  labels:
    app: stormops-demo
spec:
  selector:
    app: stormops-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
