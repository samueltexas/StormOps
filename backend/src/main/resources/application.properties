spring.application.name=stormops-api
server.address=127.0.0.1
server.port=18080
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.datasource.url=${STORMOPS_DB_URL:jdbc:postgresql://127.0.0.1:15432/stormops}
spring.datasource.username=${STORMOPS_DB_USER:stormops}
spring.datasource.password=${STORMOPS_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.flyway.enabled=true

# Authentication is mandatory outside the explicit dev profile.
stormops.security.enabled=${STORMOPS_SECURITY_ENABLED:true}
stormops.security.admin.username=${STORMOPS_ADMIN_USERNAME:admin}
stormops.security.admin.password=${STORMOPS_ADMIN_PASSWORD:}
stormops.security.viewer.username=${STORMOPS_VIEWER_USERNAME:viewer}
stormops.security.viewer.password=${STORMOPS_VIEWER_PASSWORD:}

# Bound database waits as well as network fault operations.
spring.jdbc.template.query-timeout=5s
spring.datasource.hikari.data-source-properties.socketTimeout=5

# Explicit runner credentials; never use the ambient/default kubeconfig.
stormops.kubernetes.kubeconfig=${STORMOPS_KUBECONFIG:${user.home}/Projects/StormOps/.kube/stormops-runner-config}
