spring.application.name=stormops-api
server.address=127.0.0.1
server.port=18080
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.datasource.url=${STORMOPS_DB_URL:jdbc:postgresql://127.0.0.1:15432/stormops}
spring.datasource.username=${STORMOPS_DB_USER:stormops}
spring.datasource.password=${STORMOPS_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.flyway.enabled=true

# Phase 10A: opt-in authentication. Keep disabled until Phase 10C frontend login is ready.
stormops.security.enabled=${STORMOPS_SECURITY_ENABLED:false}
stormops.security.admin.username=${STORMOPS_ADMIN_USERNAME:admin}
stormops.security.admin.password=${STORMOPS_ADMIN_PASSWORD:}
stormops.security.viewer.username=${STORMOPS_VIEWER_USERNAME:viewer}
stormops.security.viewer.password=${STORMOPS_VIEWER_PASSWORD:}
